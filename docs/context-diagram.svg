<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Context Diagram (Level 0 DFD)</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#555">Smart Parking Management System (SPMS)</text>

  <!-- Central process -->
  <circle cx="500" cy="360" r="95" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
  <text x="500" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">0</text>
  <text x="500" y="372" text-anchor="middle" font-size="14" fill="#1a1a1a">Smart Parking</text>
  <text x="500" y="390" text-anchor="middle" font-size="14" fill="#1a1a1a">Management System</text>

  <!-- Driver entity -->
  <rect x="60" y="110" width="180" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Driver</text>

  <!-- Admin entity -->
  <rect x="760" y="110" width="180" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="850" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Admin</text>

  <!-- Sensor/Camera entity -->
  <rect x="60" y="540" width="200" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="160" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Sensor / ANPR</text>
  <text x="160" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Camera</text>

  <!-- Payment Gateway entity -->
  <rect x="740" y="540" width="200" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="840" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Payment</text>
  <text x="840" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Gateway</text>

  <!-- Driver <-> System -->
  <line x1="220" y1="175" x2="440" y2="310" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="255" y="225" font-size="12.5" fill="#1a1a1a">Login / Search /</text>
  <text x="255" y="240" font-size="12.5" fill="#1a1a1a">Booking Request</text>

  <line x1="420" y1="330" x2="200" y2="182" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="270" y="290" font-size="12.5" fill="#1a1a1a">Availability / Confirmation / Receipt</text>

  <!-- Admin <-> System -->
  <line x1="780" y1="175" x2="562" y2="310" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="660" y="225" font-size="12.5" fill="#1a1a1a">Pricing Rules /</text>
  <text x="660" y="240" font-size="12.5" fill="#1a1a1a">Slot Config</text>

  <line x1="580" y1="330" x2="800" y2="182" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="605" y="290" font-size="12.5" fill="#1a1a1a">Occupancy / Revenue Reports</text>

  <!-- Sensor <-> System -->
  <line x1="230" y1="545" x2="430" y2="415" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="235" y="500" font-size="12.5" fill="#1a1a1a">Vehicle Entry /</text>
  <text x="235" y="515" font-size="12.5" fill="#1a1a1a">Exit Signal</text>

  <!-- System <-> Payment Gateway -->
  <line x1="570" y1="415" x2="775" y2="545" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="500" font-size="12.5" fill="#1a1a1a">Payment Request</text>

  <line x1="795" y1="548" x2="588" y2="405" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="470" font-size="12.5" fill="#1a1a1a">Payment Status</text>

  <!-- Legend -->
  <rect x="40" y="640" width="18" height="18" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="65" y="654" font-size="12.5" fill="#333">Process</text>
  <rect x="150" y="640" width="18" height="18" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="175" y="654" font-size="12.5" fill="#333">External Entity</text>
</svg>
