<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Level 1 DFD</text>
  <text x="600" y="54" text-anchor="middle" font-size="14" fill="#555">Smart Parking Management System (SPMS)</text>

  <!-- External entities -->
  <rect x="20" y="130" width="150" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="95" y="165" text-anchor="middle" font-size="14" font-weight="bold">Driver</text>

  <rect x="20" y="740" width="150" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="95" y="762" text-anchor="middle" font-size="14" font-weight="bold">Sensor /</text>
  <text x="95" y="780" text-anchor="middle" font-size="14" font-weight="bold">ANPR Camera</text>

  <rect x="1020" y="130" width="150" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="1095" y="165" text-anchor="middle" font-size="14" font-weight="bold">Admin</text>

  <rect x="1020" y="500" width="150" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="1095" y="522" text-anchor="middle" font-size="14" font-weight="bold">Payment</text>
  <text x="1095" y="540" text-anchor="middle" font-size="14" font-weight="bold">Gateway</text>

  <!-- Processes -->
  <circle cx="330" cy="160" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="330" y="152" text-anchor="middle" font-size="12.5" font-weight="bold">1.0</text>
  <text x="330" y="168" text-anchor="middle" font-size="11.5">Manage Login /</text>
  <text x="330" y="182" text-anchor="middle" font-size="11.5">Registration</text>

  <circle cx="330" cy="330" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="330" y="322" text-anchor="middle" font-size="12.5" font-weight="bold">2.0</text>
  <text x="330" y="338" text-anchor="middle" font-size="11.5">Search &amp; Reserve</text>
  <text x="330" y="352" text-anchor="middle" font-size="11.5">Slot</text>

  <circle cx="330" cy="620" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="330" y="612" text-anchor="middle" font-size="12.5" font-weight="bold">3.0</text>
  <text x="330" y="628" text-anchor="middle" font-size="11.5">Detect Entry /</text>
  <text x="330" y="642" text-anchor="middle" font-size="11.5">Exit</text>

  <circle cx="700" cy="500" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="700" y="492" text-anchor="middle" font-size="12.5" font-weight="bold">4.0</text>
  <text x="700" y="508" text-anchor="middle" font-size="11.5">Process Payment</text>
  <text x="700" y="522" text-anchor="middle" font-size="11.5">&amp; Billing</text>

  <circle cx="850" cy="290" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="850" y="282" text-anchor="middle" font-size="12.5" font-weight="bold">5.0</text>
  <text x="850" y="298" text-anchor="middle" font-size="11.5">Notifications</text>
  <text x="850" y="312" text-anchor="middle" font-size="11.5">&amp; Reports</text>

  <!-- Data stores -->
  <g>
    <line x1="450" y1="120" x2="450" y2="160" stroke="#065f46" stroke-width="2"/>
    <line x1="450" y1="120" x2="600" y2="120" stroke="#065f46" stroke-width="2"/>
    <line x1="450" y1="160" x2="600" y2="160" stroke="#065f46" stroke-width="2"/>
    <text x="465" y="145" font-size="12" font-weight="bold" fill="#065f46">D1  User Data</text>
  </g>

  <g>
    <line x1="450" y1="290" x2="450" y2="330" stroke="#065f46" stroke-width="2"/>
    <line x1="450" y1="290" x2="600" y2="290" stroke="#065f46" stroke-width="2"/>
    <line x1="450" y1="330" x2="600" y2="330" stroke="#065f46" stroke-width="2"/>
    <text x="465" y="315" font-size="12" font-weight="bold" fill="#065f46">D2  Slot Data</text>
  </g>

  <g>
    <line x1="450" y1="440" x2="450" y2="480" stroke="#065f46" stroke-width="2"/>
    <line x1="450" y1="440" x2="600" y2="440" stroke="#065f46" stroke-width="2"/>
    <line x1="450" y1="480" x2="600" y2="480" stroke="#065f46" stroke-width="2"/>
    <text x="460" y="465" font-size="12" font-weight="bold" fill="#065f46">D3  Booking Data</text>
  </g>

  <g>
    <line x1="820" y1="620" x2="820" y2="660" stroke="#065f46" stroke-width="2"/>
    <line x1="820" y1="620" x2="970" y2="620" stroke="#065f46" stroke-width="2"/>
    <line x1="820" y1="660" x2="970" y2="660" stroke="#065f46" stroke-width="2"/>
    <text x="835" y="645" font-size="12" font-weight="bold" fill="#065f46">D4  Payment Data</text>
  </g>

  <!-- Flows -->
  <!-- Driver -> 1.0 -->
  <line x1="170" y1="150" x2="272" y2="158" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="180" y="140" font-size="11">credentials</text>
  <!-- 1.0 -> Driver -->
  <line x1="272" y1="178" x2="170" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="180" y="200" font-size="11">auth status</text>
  <!-- 1.0 <-> D1 -->
  <line x1="390" y1="145" x2="450" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Driver -> 2.0 -->
  <line x1="170" y1="185" x2="285" y2="290" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="175" y="240" font-size="11">search / booking request</text>
  <!-- 2.0 -> Driver -->
  <line x1="290" y1="300" x2="172" y2="192" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="185" y="270" font-size="11">availability / confirmation</text>
  <!-- 2.0 <-> D2 -->
  <line x1="390" y1="320" x2="450" y2="315" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 2.0 -> D3 -->
  <line x1="370" y1="380" x2="460" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="375" y="415" font-size="11">create booking</text>

  <!-- Sensor -> 3.0 -->
  <line x1="170" y1="755" x2="280" y2="655" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="180" y="710" font-size="11">entry/exit signal</text>
  <!-- 3.0 <-> D3 -->
  <line x1="390" y1="595" x2="470" y2="485" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="395" y="545" font-size="11">update status</text>
  <!-- 3.0 -> 4.0 -->
  <line x1="390" y1="640" x2="645" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="470" y="605" font-size="11">trigger fee calculation</text>

  <!-- 4.0 <-> D4 -->
  <line x1="740" y1="550" x2="800" y2="600" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 4.0 -> Payment Gateway -->
  <line x1="758" y1="480" x2="1015" y2="480" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="830" y="470" font-size="11">payment request</text>
  <!-- Payment Gateway -> 4.0 -->
  <line x1="1015" y1="510" x2="758" y2="510" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="830" y="530" font-size="11">payment status</text>
  <!-- 4.0 -> Driver -->
  <path d="M 645 470 C 400 380, 250 300, 165 210" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="330" y="440" font-size="11">receipt</text>

  <!-- D3, D4 -> 5.0 -->
  <line x1="600" y1="450" x2="800" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="640" y="400" font-size="11">booking data</text>
  <line x1="880" y1="610" x2="870" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="885" y="470" font-size="11">payment data</text>

  <!-- 5.0 -> Admin -->
  <line x1="910" y1="270" x2="1015" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="920" y="230" font-size="11">reports</text>
  <!-- 5.0 -> Driver (notifications), long path -->
  <path d="M 795 260 C 500 120, 250 100, 168 145" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="500" y="105" font-size="11">notifications</text>

  <!-- Legend -->
  <circle cx="55" cy="850" r="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="80" y="855" font-size="12">Process</text>
  <rect x="160" y="838" width="16" height="16" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="185" y="850" font-size="12">External Entity</text>
  <line x1="320" y1="850" x2="345" y2="850" stroke="#065f46" stroke-width="2"/>
  <text x="355" y="855" font-size="12">Data Store</text>
</svg>
